# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-db
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/farhan15r/cluster-chumbucket.git
    targetRevision: main
    path: manifests/demo-db

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-db

  syncPolicy:
    # automated sync sengaja dimatikan sementara buat eksperimen orphan/reclaim-policy
    # testing (biar CR yang di-delete manual nggak langsung di-recreate sama selfHeal).
    # Balikin lagi ke automated: {prune: true, selfHeal: true} setelah selesai.
    syncOptions:
      - CreateNamespace=true
