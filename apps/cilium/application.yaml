# Cilium adalah CNI yang sedang live di cluster01.chumbucket (terpasang via helm release
# "cilium" di namespace kube-system, sudah diadopsi ke ArgoCD). Chart & valuesObject
# disamakan dengan `helm get values cilium -n kube-system` saat adopsi, supaya sync
# tidak mengubah konfigurasi CNI yang sedang berjalan.
#
# Multi-source: source pertama = chart Helm cilium dari repo resmi. Source kedua = CR
# konfigurasi asli Cilium (CiliumL2AnnouncementPolicy, CiliumLoadBalancerIPPool) dari
# repo git ini — digabung di sini (bukan app terpisah) karena satu kesatuan config
# Cilium. CRD Cilium sendiri sengaja tidak dikelola di sini: dipasang lewat folder
# crds/ chart Helm yang di luar jangkauan `helm template`/ArgoCD, dan sudah ada
# duluan di cluster. CiliumNode/CiliumIdentity/CiliumEndpoint juga tidak masuk git
# karena itu runtime state yang di-generate otomatis oleh cilium-operator/agent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default

  sources:
  - repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.2
    helm:
      valuesObject:
        k8sServiceHost: cp.cluster01.local
        k8sServicePort: 6443
        kubeProxyReplacement: true
        l2NeighDiscovery:
          enabled: true
        l2announcements:
          enabled: true
  - repoURL: https://github.com/farhan15r/cluster-chumbucket.git
    targetRevision: main
    path: manifests/cilium-config

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
