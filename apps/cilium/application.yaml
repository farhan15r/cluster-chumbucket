# Cilium adalah CNI yang sedang live di cluster01.chumbucket (terpasang via helm release
# "cilium" di namespace kube-system). Chart & valuesObject di bawah ini disamakan dengan
# `helm get values cilium -n kube-system` saat ini supaya sync pertama tidak mengubah
# konfigurasi CNI yang sedang berjalan.
#
# syncPolicy sengaja MANUAL (bukan automated) untuk app ini: cek dulu diff-nya di
# ArgoCD (App Diff / `argocd app diff cilium`) sebelum sync, karena ini komponen
# jaringan inti cluster — kalau sudah yakin aman, baru tambahkan automated: {prune, selfHeal}.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default

  sources:
  - repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.2
    helm:
      valuesObject:
        k8sServiceHost: cp.cluster01.local
        k8sServicePort: 6443
        kubeProxyReplacement: true
        l2NeighDiscovery:
          enabled: true
        l2announcements:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
